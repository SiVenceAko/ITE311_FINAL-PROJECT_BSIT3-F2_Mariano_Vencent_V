title: 'Homepage Content'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: hero_eyebrow
            field:
              type: text
              display: 'Hero Eyebrow'
              instructions: 'Small introductory text above the homepage title'
          -
            handle: hero_title
            field:
              type: text
              display: 'Hero Title'
              instructions: 'Main heading displayed in the homepage hero section'
